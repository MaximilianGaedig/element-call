# Netlify site config for element-call-experiment.netlify.app.
# Import the GitHub repo in Netlify and point the production branch at the
# top of the signals/* stack; everything else is picked up from here.
[build]
  command = "pnpm run build:full && cp config/netlify_redirects dist/_redirects && cp config/config_netlify_preview.json dist/config.json"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  NODE_OPTIONS = "--max-old-space-size=4096"
