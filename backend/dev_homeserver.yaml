server_name: "synapse.m.localhost"
public_baseurl: https://synapse.m.localhost/

pid_file: /data/homeserver.pid

listeners:
  - port: 8008
    tls: false
    type: http
    x_forwarded: true
    resources:
      - names: [client, federation, openid]
        compress: false

database:
  name: sqlite3
  args:
    database: /data/homeserver.db

media_store_path: /data/media_store
signing_key_path: "/data/SERVERNAME.signing.key"

# Due to custom TLS certificate with domains
# - m.localhost, localhost
# - *.m.localhost
# - *.othersite.m.localhost
# we disable certificate verification to allow for federation.
# WARNING: DO NOT USE IN PRODUCTION!!!
federation_verify_certificates: false
ip_range_blacklist: []
trusted_key_servers:
  - server_name: "synapse.othersite.m.localhost"
    accept_keys_insecurely: true

experimental_features:
  # MSC3266: Room summary API. Used for knocking over federation
  msc3266_enabled: true
  # MSC4222 needed for syncv2 state_after. This allow clients to
  # correctly track the state of the room.
  msc4222_enabled: true
  # sticky events for MatrixRTC user state
  msc4354_enabled: true
  # MatrixRTC
  msc4143_enabled: true
  # Push to-device events (Element Call's E2EE keys), device list changes
  # and one-time key counts to the sipbridge appservice for its virtual
  # SIP callers
  msc2409_to_device_messages_enabled: true
  msc3202_device_masquerading: true
  msc3202_transaction_extensions: true

# The maximum allowed duration by which sent events can be delayed, as
# per MSC4140. Must be a positive value if set.  Defaults to no
# duration (null), which disallows sending delayed events.
max_event_delay_duration: 24h

# Required for Element Call in Single Page Mode due to on-the-fly user registration
enable_registration: true
enable_registration_without_verification: true

# Shared secret for admin user registration via API (for testing only!)
registration_shared_secret: "test_shared_secret_for_local_dev_only"

report_stats: false

# Ratelimiting settings for client actions (registration, login, messaging).
#
# Each ratelimiting configuration is made of two parameters:
#   - per_second: number of requests a client can send per second.
#   - burst_count: number of requests a client can send before being throttled.

# The sipbridge bots get invited into every call that records or allows
# dial-in, which the default invite rate limit stops after a handful
rc_invites:
  per_room:
    per_second: 100
    burst_count: 100
  per_user:
    per_second: 100
    burst_count: 100
  per_issuer:
    per_second: 100
    burst_count: 100

rc_message:
  # This needs to match at least the heart-beat frequency plus a bit of headroom
  # Currently the heart-beat is every 5 seconds which translates into a rate of 0.2s
  per_second: 0.5
  burst_count: 30

app_service_config_files:
  - /appservices/sipbridge-registration.yaml

matrix_rtc:
  transports:
    - type: livekit
      livekit_service_url: https://matrix-rtc.m.localhost/livekit/jwt
