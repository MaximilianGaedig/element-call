# The stock nginx.conf, plus a stream front on 443 that routes by SNI: the
# SFU's TURN-over-TLS name goes straight to LiveKit (which puts port 443 in
# the URL it hands out), everything else to the HTTP servers in dev_nginx.conf
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

stream {
    map $ssl_preread_server_name $tls_upstream {
        turn.m.localhost livekit-sfu:5349;
        default          127.0.0.1:8443;
    }
    server {
        listen      443;
        listen      [::]:443;
        # Docker's DNS, at request time, so nginx starts before LiveKit does
        resolver    127.0.0.11 valid=10s;
        ssl_preread on;
        proxy_pass  $tls_upstream;
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;
    sendfile        on;
    keepalive_timeout  65;
    include /etc/nginx/conf.d/*.conf;
}
