port: 7880
bind_addresses:
  - "0.0.0.0"
rtc:
  tcp_port: 7881
  port_range_start: 50100
  port_range_end: 50200
  use_external_ip: false
# TURN over UDP, so that a browser whose host candidates the SFU can't reach
# (Firefox hides them behind mDNS until the page is capturing) still connects
turn:
  enabled: true
  domain: localhost
  udp_port: 3478
  relay_range_start: 30000
  relay_range_end: 30100
keys:
  devkey: secret
room:
  auto_create: false
webhook:
  api_key: devkey
  urls:
    - https://matrix-rtc.m.localhost/livekit/jwt/sfu_webhook
