networks:
  ecbackend:

services:
  auth-service:
    image: ghcr.io/element-hq/lk-jwt-service:0.4.4
    pull_policy: always
    hostname: auth-server
    environment:
      - LIVEKIT_JWT_PORT=6080
      - LIVEKIT_URL=wss://matrix-rtc.m.localhost/livekit/sfu
      - LIVEKIT_KEY=devkey
      - LIVEKIT_SECRET=secret
      # If the configured homeserver runs on localhost, it'll probably be using
      # a self-signed certificate
      - LIVEKIT_INSECURE_SKIP_VERIFY_TLS=YES_I_KNOW_WHAT_I_AM_DOING
      - LIVEKIT_FULL_ACCESS_HOMESERVERS=*
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      # HOST_PORT:CONTAINER_PORT
      - 6080:6080
    networks:
      - ecbackend

  auth-service-1:
    image: ghcr.io/element-hq/lk-jwt-service:0.4.4
    pull_policy: always
    hostname: auth-server-1
    environment:
      - LIVEKIT_JWT_PORT=16080
      - LIVEKIT_URL=wss://matrix-rtc.othersite.m.localhost/livekit/sfu
      - LIVEKIT_KEY=devkey
      - LIVEKIT_SECRET=secret
      # If the configured homeserver runs on localhost, it'll probably be using
      # a self-signed certificate
      - LIVEKIT_INSECURE_SKIP_VERIFY_TLS=YES_I_KNOW_WHAT_I_AM_DOING
      - LIVEKIT_FULL_ACCESS_HOMESERVERS=*
    deploy:
      restart_policy:
        condition: on-failure
    ports:
      # HOST_PORT:CONTAINER_PORT
      - 16080:16080
    networks:
      - ecbackend

  livekit:
    image: livekit/livekit-server:v1.13.4
    pull_policy: always
    hostname: livekit-sfu
    command: --dev --config /etc/livekit.yaml
    restart: unless-stopped
    # The SFU seems to work far more reliably when we let it share the host
    # network rather than opening specific ports (but why?? we're not missing
    # any…)
    ports:
      # HOST_PORT:CONTAINER_PORT
      - 7880:7880/tcp
      - 7881:7881/tcp
      - 7882:7882/tcp
      - 50100-50200:50100-50200/udp
    volumes:
      - ./backend/dev_tls_m.localhost.crt:/local_cert.pem:Z
      - ./backend/dev_livekit.yaml:/etc/livekit.yaml:Z
    environment:
      - SSL_CERT_FILE=/local_cert.pem
    networks:
      - ecbackend

  livekit-1:
    image: livekit/livekit-server:v1.13.4
    pull_policy: always
    hostname: livekit-sfu-1
    command: --dev --config /etc/livekit.yaml
    restart: unless-stopped
    # The SFU seems to work far more reliably when we let it share the host
    # network rather than opening specific ports (but why?? we're not missing
    # any…)
    ports:
      # HOST_PORT:CONTAINER_PORT
      - 17880:17880/tcp
      - 17881:17881/tcp
      - 17882:17882/tcp
      - 50300-50400:50300-50400/udp
    volumes:
      - ./backend/dev_tls_m.localhost.crt:/local_cert.pem:Z
      - ./backend/dev_livekit-othersite.yaml:/etc/livekit.yaml:Z
    environment:
      - SSL_CERT_FILE=/local_cert.pem
    networks:
      - ecbackend

  synapse:
    hostname: homeserver
    image: ghcr.io/element-hq/synapse:latest
    pull_policy: always
    environment:
      - SYNAPSE_CONFIG_PATH=/data/cfg/homeserver.yaml
      # Needed for rootless podman-compose such that the uid/gid mapping does
      # fit local user uid. If the container runs as root (uid 0) it is fine as
      # it actually maps to your non-root user on the host (e.g. 1000).
      # Otherwise uid mapping will not match your non-root user.
      - UID=0
      - GID=0
    volumes:
      - ./backend/synapse_tmp:/data:Z
      - ./backend/dev_homeserver.yaml:/data/cfg/homeserver.yaml:Z
      - ./backend/dev_sipbridge-registration.yaml:/appservices/sipbridge-registration.yaml:Z
    networks:
      - ecbackend

  # Records calls and bridges SIP callers in; see backend/dev_sipbridge.toml.
  # Pulled from ghcr.io (a private package: `docker login ghcr.io` with a
  # token that can read packages first); the tag is the bridge commit.
  # Start it with `docker compose -f docker-compose-dev.yml --profile sipbridge up`.
  # To run local bridge changes instead, `up --build` builds it from a
  # checkout of matrixrtc-sip-bridge and its patched matrix-rust-sdk next to
  # this repo:
  #   git clone https://github.com/element-hq/matrixrtc-sip-bridge ../matrixrtc-sip-bridge
  #   git clone -b matthew/as https://github.com/element-hq/matrix-rust-sdk-private ../matrix-rust-sdk-private
  sipbridge:
    profiles: [sipbridge]
    image: ghcr.io/element-hq/matrixrtc-sip-bridge:5d646d9
    build:
      context: ../matrixrtc-sip-bridge
      additional_contexts:
        sdk: ../matrix-rust-sdk-private
    hostname: sipbridge
    restart: unless-stopped
    environment:
      # Trust the dev CA for the homeserver, LiveKit and Element Call
      - SSL_CERT_FILE=/usr/local/share/ca-certificates/dev-ca.crt
      # WPE's web process sandboxes itself with bwrap, which needs user
      # namespaces the container doesn't have; the container is the sandbox
      - WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
      # GLib resolves *.localhost to loopback, so route loopback:443 to nginx
      - MATRIXRTC_LOOPBACK_TLS_UPSTREAM=nginx:443
      # Where `!transcribe` streams audio: the `voxtral` service below by
      # default, or set VOXTRAL_URL to a Voxtral server on the host, e.g.
      # mlx-audio on Apple Silicon (see README)
      - MATRIXRTC_BRIDGE_VOXTRAL_URL=${VOXTRAL_URL:-ws://voxtral:8000}
    volumes:
      - ./backend/dev_sipbridge.toml:/app/config.toml:Z
      - ./backend/dev_sipbridge-registration.yaml:/app/appservice-registration.yaml:Z
      - ./backend/dev_tls_local-ca.crt:/usr/local/share/ca-certificates/dev-ca.crt:Z
      - ./backend/sipbridge_tmp:/app/store:Z
      - ./backend/sipbridge_recordings:/app/recordings:Z
    ports:
      # SIP signalling; RTP media stays inside the docker network
      - 5062:5062/udp
      - 5062:5062/tcp
    depends_on:
      # The bridge logs in at startup and exits if the homeserver isn't
      # answering yet, and Synapse backs off pushing to an appservice that
      # keeps refusing connections
      synapse:
        condition: service_healthy
      nginx:
        condition: service_started
    networks:
      - ecbackend

  # Mistral Voxtral Realtime behind vLLM, for the bridge's `!transcribe`
  # (it opens one /v1/realtime WebSocket per speaker). NVIDIA-only: vLLM's
  # image is CUDA and Voxtral Realtime runs nowhere else, and it needs
  # >= 16 GB VRAM, so it sits in its own profile and the bridge just replies
  # "can't reach Voxtral" when it's not up:
  #   docker compose -f docker-compose-dev.yml --profile sipbridge --profile voxtral up
  # First start downloads ~8 GB of weights into backend/voxtral_tmp.
  # On a Mac, run mlx-audio on the host instead and point the bridge at it
  # with VOXTRAL_URL=ws://host.docker.internal:8000 (no profile needed).
  voxtral:
    profiles: [voxtral]
    image: vllm/vllm-openai:v0.29.0
    hostname: voxtral
    restart: unless-stopped
    # Flags per https://recipes.vllm.ai/mistralai/Voxtral-Mini-4B-Realtime-2602:
    # --tokenizer-mode mistral is mandatory (the tokenizer only loads via
    # mistral_common); the cudagraph mode is the recipe's default.
    command: >
      mistralai/Voxtral-Mini-4B-Realtime-2602
      --tokenizer-mode mistral
      --compilation_config '{"cudagraph_mode": "PIECEWISE"}'
    environment:
      - VLLM_DISABLE_COMPILE_CACHE=1
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ./backend/voxtral_tmp:/root/.cache/huggingface:Z
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      # Weight download + model load
      start_period: 15m
    networks:
      - ecbackend

  # A baresip caller with VP8 video for the playwright sipbridge tests
  # (playwright/sipbridge/), which run it themselves; `up` never starts it.
  # It shares the bridge's network namespace so that its media reaches the
  # bridge's unpublished RTP ports on 127.0.0.1.
  sipcaller:
    profiles: [sipbridge, sipcaller]
    build: ./backend/sipcaller
    network_mode: "service:sipbridge"
    volumes:
      - ./backend/sipcaller_tmp:/out:Z

  synapse-1:
    hostname: homeserver-1
    image: ghcr.io/element-hq/synapse:latest
    pull_policy: always
    environment:
      - SYNAPSE_CONFIG_PATH=/data/cfg/homeserver.yaml
      # Needed for rootless podman-compose such that the uid/gid mapping does
      # fit local user uid. If the container runs as root (uid 0) it is fine as
      # it actually maps to your non-root user on the host (e.g. 1000).
      # Otherwise uid mapping will not match your non-root user.
      - UID=0
      - GID=0
    volumes:
      - ./backend/synapse_tmp_othersite:/data:Z
      - ./backend/dev_homeserver-othersite.yaml:/data/cfg/homeserver.yaml:Z
    networks:
      - ecbackend

  element-web:
    image: ghcr.io/element-hq/element-web:develop
    pull_policy: always
    volumes:
      - ./backend/ew.test.config.json:/app/config.json:Z
    environment:
      ELEMENT_WEB_PORT: 8081
    ports:
      - "8081:8081"
    networks:
      - ecbackend

  element-web-1:
    image: ghcr.io/element-hq/element-web:develop
    pull_policy: always
    volumes:
      - ./backend/ew.test.othersite.config.json:/app/config.json:Z
    environment:
      ELEMENT_WEB_PORT: 18081
    ports:
      # HOST_PORT:CONTAINER_PORT
      - "18081:18081"
    networks:
      - ecbackend

  nginx:
    #  see backend/dev_tls_setup for how to generate the tls certs
    hostname: synapse.m.localhost
    image: nginx:latest@sha256:4ae259ae64fbedb67918c07d167fdcb0e05855a1615480ca445bea485e7d65ff
    pull_policy: always
    volumes:
      - ./backend/dev_nginx.conf:/etc/nginx/conf.d/default.conf:Z
      - ./backend/dev_tls_m.localhost.key:/root/ssl/key.pem:Z
      - ./backend/dev_tls_m.localhost.crt:/root/ssl/cert.pem:Z
    ports:
      # HOST_PORT:CONTAINER_PORT
      - "443:443"
      - "8008:80"
      - "4443:443"
      - "8448:8448"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "auth-server:127.0.0.1"
      - "auth-server-1:127.0.0.1"
    depends_on:
      - synapse
    networks:
      ecbackend:
        aliases:
          - synapse.m.localhost
          - synapse.othersite.m.localhost
          - matrix-rtc.m.localhost
          - matrix-rtc.othersite.m.localhost
          # So the sipbridge container can load Element Call as a widget
          - call.m.localhost
